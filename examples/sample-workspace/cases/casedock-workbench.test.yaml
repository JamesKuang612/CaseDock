# 用于演示只读页面；保存文件本身不代表已通过。
schemaVersion: 1
id: casedock-workbench
title: 示例：CaseDock 测试资产查看
source: |-
  打开 CaseDock 本地查看页面，确认用例列表和详情页展示正常。
  1. 打开初始地址，查看用例列表
  2. 点击某个用例，查看详情页
  预期：列表和详情都能正确展示
tags:
  - example
  - smoke
preconditions:
  - CaseDock 本地查看页面已启动，初始地址可访问
steps:
  - id: open-library
    action: 打开初始地址，查看测试用例列表
    assertions:
      - id: library-visible
        expect: 页面显示“测试用例”，并列出用例名称和执行概况
        evidence:
          - screenshot
  - id: open-details
    action: 点击一个测试用例进入详情页
    assertions:
      - id: details-visible
        expect: 页面显示用例内容、执行记录、执行详情和截图证据
        evidence:
          - screenshot
