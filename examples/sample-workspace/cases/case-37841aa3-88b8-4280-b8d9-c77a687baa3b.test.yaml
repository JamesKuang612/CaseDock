schemaVersion: 1
id: case-37841aa3-88b8-4280-b8d9-c77a687baa3b
title: 配置项校验-插件属性
source: |-
  配置项校验-插件属性
  初始URL：https://test.jdydevelop.com/dashboard#/
  账密：1875931049@qq.com/Jdy123456
  功能场景：插件配置
  测试步骤：
  1.进入插件属性页面，浏览属性项
  2.配置属性-概述，填写内容超过40个字符，校验聚焦及失焦状态显示
  3.配置属性-插件详情，填写内容超过500个字符，校验聚焦及失焦状态显示
  4.配置属性-帮助文档，填写内容超过100个字符，校验聚焦及失焦状态显示
  测试数据：
  插件属性入口：
  1、新建插件后，跳转页面-插件属性tab
  2、已生成插件，插件管理页面-插件A-编辑插件
  预期结果（PC端）：
  check：展示插件图标、插件概述、插件详情、帮助文档
  check：聚焦时红字显示“最多输入40个字”，失焦后超过40个字部分截断
  check：聚焦时红字显示“最多输入500个字”，失焦后超过500个字部分截断
  check：聚焦时红字显示“最多输入100个字”，失焦后超过100个字部分截断
tags:
  - 插件配置
  - 边界值校验
preconditions:
  - 拥有开发自建插件权限的简道云账号
steps:
  - id: step-1
    action: 进入插件属性页面，浏览属性项
    assertions:
      - id: assertion-1-1
        expect: 展示插件图标、插件概述、插件详情、帮助文档
        evidence:
          - screenshot
  - id: step-2
    action: 配置属性-概述，填写内容超过40个字符，校验聚焦及失焦状态显示
    assertions:
      - id: assertion-2-1
        expect: 聚焦时红字显示“最多输入40个字”，失焦后超过40个字部分截断
        evidence:
          - screenshot
  - id: step-3
    action: 配置属性-插件详情，填写内容超过500个字符，校验聚焦及失焦状态显示
    assertions:
      - id: assertion-3-1
        expect: 聚焦时红字显示“最多输入500个字”，失焦后超过500个字部分截断
        evidence:
          - screenshot
  - id: step-4
    action: 配置属性-帮助文档，填写内容超过100个字符，校验聚焦及失焦状态显示
    assertions:
      - id: assertion-4-1
        expect: 聚焦时红字显示“最多输入100个字”，失焦后超过100个字部分截断
        evidence:
          - screenshot
